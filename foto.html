<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Foto Proyek — Pitamaha 5</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f1117; color: #e4e6eb; line-height: 1.6; }
    a { color: #a78bfa; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .header { display: flex; align-items: center; justify-content: space-between; padding: 20px 32px; border-bottom: 1px solid #2a2d3a; }
    .header h1 { font-size: 1.3rem; font-weight: 600; }
    .back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 0.9rem; color: #9ca3af; }
    .nav-links { display: flex; gap: 20px; }
    .nav-links a { font-size: 0.9rem; color: #9ca3af; transition: color 0.2s; }
    .nav-links a:hover, .nav-links a.active { color: #e4e6eb; text-decoration: none; }
    .main { max-width: 1200px; margin: 0 auto; padding: 32px; }
    .subtitle { font-size: 0.85rem; color: #6b7280; margin-bottom: 24px; }
    .stats-bar { display: flex; gap: 32px; margin-bottom: 24px; flex-wrap: wrap; }
    .stat-item { font-size: 0.9rem; }
    .stat-value { font-weight: 600; color: #e4e6eb; }
    .stat-label { color: #6b7280; }
    .filter-bar { display: flex; gap: 8px; margin-bottom: 28px; flex-wrap: wrap; }
    .filter-btn { padding: 6px 16px; border-radius: 20px; border: 1px solid #374151; background: transparent; color: #9ca3af; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; }
    .filter-btn:hover { border-color: #a78bfa; color: #e4e6eb; }
    .filter-btn.active { background: #a78bfa; border-color: #a78bfa; color: #0f1117; font-weight: 600; }
    .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .photo-card { position: relative; border-radius: 12px; overflow: hidden; cursor: pointer; aspect-ratio: 4/3; background: #1a1d2e; }
    .photo-card.wide { grid-column: span 2; aspect-ratio: 16/9; }
    .photo-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
    .photo-card:hover img { transform: scale(1.05); }
    .photo-caption { position: absolute; bottom: 0; left: 0; right: 0; padding: 12px; background: linear-gradient(transparent, rgba(0,0,0,0.8)); font-size: 0.8rem; color: #e4e6eb; }
    .date-section { margin-bottom: 32px; }
    .date-title { font-size: 1rem; font-weight: 600; margin-bottom: 16px; color: #a78bfa; }
    .video-card { padding: 16px; background: #1a1d2e; border-radius: 12px; margin-bottom: 12px; font-size: 0.9rem; }
    .load-more-wrap { text-align: center; padding: 24px 0; }
    .load-more-btn { padding: 10px 28px; border-radius: 8px; border: 1px solid #374151; background: transparent; color: #e4e6eb; cursor: pointer; font-size: 0.9rem; transition: all 0.2s; }
    .load-more-btn:hover { border-color: #a78bfa; background: #a78bfa; color: #0f1117; }
    .load-more-info { font-size: 0.8rem; color: #6b7280; margin-top: 8px; }
    .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; align-items: center; justify-content: center; flex-direction: column; }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 90vw; max-height: 80vh; border-radius: 8px; }
    .lightbox-caption { margin-top: 16px; font-size: 0.95rem; color: #e4e6eb; text-align: center; }
    .lightbox-close { position: absolute; top: 24px; right: 32px; font-size: 2rem; color: #e4e6eb; cursor: pointer; background: none; border: none; }
    .lightbox-nav { position: absolute; top: 50%; transform: translateY(-50%); font-size: 2.5rem; color: #e4e6eb; cursor: pointer; background: none; border: none; padding: 16px; }
    .lightbox-prev { left: 16px; }
    .lightbox-next { right: 16px; }
    .empty-state { text-align: center; padding: 64px 32px; color: #6b7280; }
    .empty-icon { font-size: 3rem; margin-bottom: 16px; }
    .instruction-box { background: #1a1d2e; border-left: 3px solid #a78bfa; padding: 20px 24px; border-radius: 0 12px 12px 0; margin-bottom: 32px; font-size: 0.85rem; }
    .instruction-box strong { color: #a78bfa; }
    .instruction-box code { background: #2a2d3a; padding: 2px 6px; border-radius: 4px; font-size: 0.8rem; }
    @media (max-width: 768px) {
      .header { flex-direction: column; gap: 16px; align-items: flex-start; }
      .photo-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
      .photo-card.wide { grid-column: span 1; }
      .stats-bar { gap: 16px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <a href="index.html" class="back-link">← Kembali</a>
    <h1>Pitamaha 5</h1>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="foto.html" class="active">Foto</a>
      <a href="pembahasan.html">Pembahasan</a>
    </div>
  </div>

  <div class="main">
    <div class="subtitle">KBP - Pitaloka · Dokumentasi Lapangan</div>
    <div class="stats-bar">
      <div class="stat-item"><span id="photoCount" class="stat-value">— foto</span></div>
      <div class="stat-item"><span class="stat-label">Terakhir diperbarui:</span> <span id="lastUpdate" class="stat-value">—</span></div>
      <div class="stat-item"><span id="videoCount" class="stat-value">Belum ada video</span></div>
    </div>
    <div id="filterBar" class="filter-bar"></div>
    <div class="instruction-box">
      <strong>📌 Cara tambah foto baru</strong><br><br>
      1. Login <code>cloudinary.com</code> → Media Library → Upload foto<br>
      2. Klik foto → salin Public ID<br>
      3. Buka <code>foto.html</code> → tambah di <code>const photos = [</code>
    </div>
    <div id="galleryContainer"></div>
    <div id="videoContainer"></div>
  </div>

  <div id="lightbox" class="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()">×</button>
    <button class="lightbox-nav lightbox-prev" onclick="navigatePhoto(-1)">‹</button>
    <img id="lightboxImg" src="" alt="" />
    <div id="lightboxCaption" class="lightbox-caption"></div>
    <button class="lightbox-nav lightbox-next" onclick="navigatePhoto(1)">›</button>
  </div>

<script>
// ═══════════════════════════════════════════════
// KONFIGURASI
// ═══════════════════════════════════════════════
const CLOUD_NAME = 'drzht9qq1';

const photos = [
  { id: "20251222-survei-12_uguay3", date: "22 Desember 2025", caption: "Survey kondisi awal - foto 12", wide: false },
  { id: "20251222-survei-11_vllyhu", date: "22 Desember 2025", caption: "Survey kondisi awal - foto 11", wide: false },
  { id: "20251222-survei-07_ri432g", date: "22 Desember 2025", caption: "Survey kondisi awal - foto 07", wide: false },
  { id: "20251222-survei-13_j1cpxr", date: "22 Desember 2025", caption: "Survey kondisi awal - foto 13", wide: false },
  { id: "20251222-survei-14_ieoeme", date: "22 Desember 2025", caption: "Survey kondisi awal - foto 14", wide: false },
  { id: "20251222-survei-02_e1yjpj", date: "22 Desember 2025", caption: "Survey kondisi awal - foto 02", wide: false },
  { id: "20251222-survei-09_mx23l6", date: "22 Desember 2025", caption: "Survey kondisi awal - foto 09", wide: false },
  { id: "20251222-survei-10_y9ywax", date: "22 Desember 2025", caption: "Survey kondisi awal - foto 10", wide: false },
  { id: "20251222-survei-05_hmbyvi", date: "22 Desember 2025", caption: "Survey kondisi awal - foto 05", wide: false },
  { id: "20251222-survei-06_gnkynx", date: "22 Desember 2025", caption: "Survey kondisi awal - foto 06", wide: false },
  { id: "20251222-survei-03_krknpm", date: "22 Desember 2025", caption: "Survey kondisi awal - foto 03", wide: false },
  { id: "20251222-survei-04_egndlp", date: "22 Desember 2025", caption: "Survey kondisi awal - foto 04", wide: false },
  { id: "20251222-survei-01_vakmu5", date: "22 Desember 2025", caption: "Survey kondisi awal - foto 01", wide: false },
  { id: "20251222-survei-08_lq7unn", date: "22 Desember 2025", caption: "Survey kondisi awal - foto 08", wide: false }
];

const videos = [];

function buildVideos() {
  const container = document.getElementById('videoContainer');
  const countEl = document.getElementById('videoCount');
  if (countEl) countEl.textContent = videos.length > 0 ? `${videos.length} video` : 'Belum ada video';
  if (!container || videos.length === 0) return;
  container.innerHTML = '';
  videos.slice().sort((a, b) => new Date(b.date) - new Date(a.date)).forEach(v => {
    const card = document.createElement('div');
    card.className = 'video-card';
    card.innerHTML = `<strong>${v.date}</strong> — ${v.caption}`;
    container.appendChild(card);
  });
}

function driveUrl(id) {
  return `https://res.cloudinary.com/${CLOUD_NAME}/image/upload/q_auto,f_auto/${id}`;
}

const PHOTOS_PER_PAGE = 50;
let currentIndex = 0;
let filteredPhotos = [];
let displayedCount = 0;

function renderPhotos(data, startIdx, endIdx) {
  const container = document.getElementById('galleryContainer');
  if (!container) return;
  const slice = data.slice(startIdx, endIdx);
  const grouped = {};
  slice.forEach(p => {
    if (!grouped[p.date]) grouped[p.date] = [];
    grouped[p.date].push(p);
  });
  Object.keys(grouped).sort((a, b) => new Date(b) - new Date(a)).forEach(date => {
    let section = container.querySelector(`[data-date="${date}"]`);
    if (!section) {
      section = document.createElement('div');
      section.setAttribute('data-date', date);
      section.className = 'date-section';
      section.innerHTML = `<div class="date-title">${date}</div>`;
      const grid = document.createElement('div');
      grid.className = 'photo-grid';
      grid.setAttribute('data-grid', date);
      section.appendChild(grid);
      const loadMoreEl = document.getElementById('loadMoreWrap');
      if (loadMoreEl) container.insertBefore(section, loadMoreEl);
      else container.appendChild(section);
    }
    const grid = section.querySelector(`[data-grid="${date}"]`);
    grouped[date].forEach(p => {
      const card = document.createElement('div');
      card.className = `photo-card${p.wide ? ' wide' : ''}`;
      const img = document.createElement('img');
      img.src = driveUrl(p.id);
      img.alt = p.caption;
      img.loading = 'lazy';
      img.decoding = 'async';
      img.onerror = () => { img.src = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100%" height="100%" fill="%231a1d2e"/><text x="50%" y="50%" fill="%236b7280" text-anchor="middle" dy=".3em">Gagal muat</text></svg>'; };
      card.appendChild(img);
      const cap = document.createElement('div');
      cap.className = 'photo-caption';
      cap.textContent = p.caption;
      card.appendChild(cap);
      card.onclick = () => openLightbox(p.globalIdx);
      grid.appendChild(card);
    });
  });
}

function buildGallery(data) {
  filteredPhotos = data;
  displayedCount = 0;
  const container = document.getElementById('galleryContainer');
  if (!container) return;
  container.innerHTML = '';
  if (data.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="empty-icon">📷</div><p>${photos.length === 0 ? 'Belum ada foto' : 'Tidak ada foto untuk filter ini'}</p></div>`;
    return;
  }
  const loadMoreWrap = document.createElement('div');
  loadMoreWrap.id = 'loadMoreWrap';
  loadMoreWrap.className = 'load-more-wrap';
  loadMoreWrap.innerHTML = `<button id="loadMoreBtn" class="load-more-btn" onclick="loadMore()">Tampilkan lebih banyak</button><div id="loadMoreInfo" class="load-more-info"></div>`;
  container.appendChild(loadMoreWrap);
  const first = Math.min(PHOTOS_PER_PAGE, data.length);
  renderPhotos(data, 0, first);
  displayedCount = first;
  updateLoadMore();
}

function loadMore() {
  const next = Math.min(displayedCount + PHOTOS_PER_PAGE, filteredPhotos.length);
  renderPhotos(filteredPhotos, displayedCount, next);
  displayedCount = next;
  updateLoadMore();
}

function updateLoadMore() {
  const wrap = document.getElementById('loadMoreWrap');
  const info = document.getElementById('loadMoreInfo');
  const btn = document.getElementById('loadMoreBtn');
  if (!wrap) return;
  if (displayedCount < filteredPhotos.length) {
    wrap.style.display = 'block';
    if (info) info.textContent = `Menampilkan ${displayedCount} dari ${filteredPhotos.length} foto · ${filteredPhotos.length - displayedCount} lagi`;
    if (btn) btn.style.display = 'inline-block';
  } else {
    wrap.style.display = displayedCount > PHOTOS_PER_PAGE ? 'block' : 'none';
    if (info) info.textContent = `Semua ${filteredPhotos.length} foto ditampilkan`;
    if (btn) btn.style.display = 'none';
  }
}

function filterGallery(filter, e) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  if (e && e.currentTarget) e.currentTarget.classList.add('active');
  const data = filter === 'semua' ? photos : photos.filter(p => p.date === filter);
  buildGallery(data.map((p, i) => ({ ...p, globalIdx: photos.indexOf(p) })));
}

function openLightbox(idx) {
  currentIndex = idx;
  const p = photos[idx];
  const img = document.getElementById('lightboxImg');
  const cap = document.getElementById('lightboxCaption');
  const lb = document.getElementById('lightbox');
  if (img) img.src = driveUrl(p.id);
  if (cap) cap.textContent = `${p.date} — ${p.caption}`;
  if (lb) { lb.classList.add('open'); document.body.style.overflow = 'hidden'; }
}

function closeLightbox() {
  const lb = document.getElementById('lightbox');
  if (lb) lb.classList.remove('open');
  document.body.style.overflow = '';
}

function navigatePhoto(dir) {
  currentIndex = (currentIndex + dir + photos.length) % photos.length;
  openLightbox(currentIndex);
}

document.addEventListener('keydown', e => {
  const lb = document.getElementById('lightbox');
  if (!lb || !lb.classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') navigatePhoto(-1);
  if (e.key === 'ArrowRight') navigatePhoto(1);
});

function init() {
  const photoCountEl = document.getElementById('photoCount');
  const lastUpdateEl = document.getElementById('lastUpdate');
  const filterBar = document.getElementById('filterBar');
  if (photoCountEl) photoCountEl.textContent = photos.length > 0 ? `${photos.length} foto` : 'Belum ada foto';
  if (lastUpdateEl) {
    const dates = [...new Set(photos.map(p => p.date))].sort((a, b) => new Date(b) - new Date(a));
    lastUpdateEl.textContent = dates.length > 0 ? dates[0] : '—';
  }
  if (filterBar) {
    const uniqueDates = [...new Set(photos.map(p => p.date))].sort((a, b) => new Date(b) - new Date(a));
    const allBtn = document.createElement('button');
    allBtn.className = 'filter-btn active';
    allBtn.textContent = 'Semua';
    allBtn.onclick = (e) => filterGallery('semua', e);
    filterBar.appendChild(allBtn);
    uniqueDates.forEach(date => {
      const btn = document.createElement('button');
      btn.className = 'filter-btn';
      btn.textContent = date;
      btn.onclick = (e) => filterGallery(date, e);
      filterBar.appendChild(btn);
    });
  }
  buildGallery(photos.map((p, i) => ({ ...p, globalIdx: i })));
  buildVideos();
}

init();
</script>
</body>
</html>
