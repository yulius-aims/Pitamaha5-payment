<script>
// ═══════════════════════════════════════════════
// KONFIGURASI - ISI BAGIAN INI DULU!
// ═══════════════════════════════════════════════
const CLOUD_NAME = 'drzht9qq1'; // Ganti dengan nama cloudinary kamu (contoh: pitamaha5)

// ═══════════════════════════════════════════════
// DAFTAR FOTO — tambah/hapus di sini
// Format: { id: "PUBLIC_ID", date: "DD Mon YYYY", caption: "Keterangan", wide: false }
// Public ID bisa disalin dari Media Library Cloudinary setelah upload
// ═══════════════════════════════════════════════
const photos = [
  { id: "20251222-survei-12_uguay3", date: "22 Desember 2025", caption: "Survey kondisi awal - foto 12", wide: false },
  { id: "20251222-survei-11_vllyhu", date:  "22 Desember 2025", caption: "Survey kondisi awal - foto 11", wide: false },
  { id: "20251222-survei-07_ri432g", date: "22 Desember 2025", caption: "Survey kondisi awal - foto 07" , wide: false },
  { id: "20251222-survei-13_j1cpxr", date: "22 Desember 2025", caption: "Survey kondisi awal - foto 13", wide: false },
  { id: "20251222-survei-14_ieoeme", date:  "22 Desember 2025", caption: "Survey kondisi awal - foto 14", wide: false },
  { id: "20251222-survei-02_e1yjpj", date: "22 Desember 2025", caption: "Survey kondisi awal - foto 02" , wide: false },
  { id: "20251222-survei-09_mx23l6", date: "22 Desember 2025", caption: "Survey kondisi awal - foto 09", wide: false },
  { id: "20251222-survei-10_y9ywax", date:  "22 Desember 2025", caption: "Survey kondisi awal - foto 10", wide: false },
  { id: "20251222-survei-05_hmbyvi", date: "22 Desember 2025", caption: "Survey kondisi awal - foto 05" , wide: false },
  { id: "20251222-survei-06_gnkynx", date: "22 Desember 2025", caption: "Survey kondisi awal - foto 06", wide: false },
  { id: "20251222-survei-03_krknpm", date:  "22 Desember 2025", caption: "Survey kondisi awal - foto 03", wide: false },
  { id: "20251222-survei-04_egndlp", date: "22 Desember 2025", caption: "Survey kondisi awal - foto 04" , wide: false },
  { id: "20251222-survei-01_vakmu5", date: "22 Desember 2025", caption: "Survey kondisi awal - foto 01", wide: false },
  { id: "20251222-survei-08_lq7unn", date:  "22 Desember 2025", caption: "Survey kondisi awal - foto 08", wide: false },
];

// ═══════════════════════════════════════════════
// DAFTAR VIDEO — tambahkan di sini
// Format: {  id: 'YOUTUBE_VIDEO_ID', date: 'DD Mon YYYY', caption: 'Keterangan' }
// YouTube ID contoh: dari link youtube.com/watch?v=dQw4w9WgXcQ → ID = dQw4w9WgXcQ
// ════════════════════════ ═══════════════════════
const videos = [
  // CONTOH — hapus dan ganti dengan video asli:
  // { id: 'dQw4w9WgXcQ', date: '1 Juni 2026', caption: 'Progress pengecoran lantai 2' },
   // { id: 'abc123XYZ', date: '8 Juni 2026', caption: 'Pemasangan rangka atap' },
];

function buildVideos() {
  const container = document.getElementById('videoContainer');
  document.getElementById('videoCount').textContent =
    videos.length > 0 ? `${videos.length} video` : 'Belum ada video';

  if (videos.length === 0) return;
  container.innerHTML = '' ;

  videos.slice().sort((a, b) => new Date(b.date) - new Date(a.date)).forEach(v => {
    const card = document.createElement('div');
    card.className = 'video-card';
    card.innerHTML = `
       ${v.date} ${v.caption} `;
    container.appendChild(card);
  });
}

// ═══════════════════════════════════════════════
// JANGAN EDIT DI BAWAH INI
// ═══════════════════════════════════════════════

function driveUrl(id) {
  // Cloudinary: auto quality + format untuk loading lebih cepat
  return `https://res.cloudinary.com/${CLOUD_NAME}/image/upload/q_auto,f_auto/${id}`;
}

const PHOTOS_PER_PAGE = 50;
let currentIndex = 0;
let filteredPhotos = [];
let displayedCount = 0;
let activeFilter = 'semua';

function renderPhotos(data, startIdx, endIdx) {
  const container = document.getElementById('galleryContainer');

  // Kelompokkan slice yang akan dirender
  const slice = data.slice(startIdx, endIdx);
  const grouped = {};
  slice.forEach(p => {
    if (!grouped[p.date]) grouped[p.date] = [];
    grouped[p.date].push(p);
  });

  // Cek apakah section tanggal sudah ada (untuk append)
  Object.keys(grouped).sort((a, b) => new Date(b) - new Date(a)).forEach(date => {
    let section = container.querySelector(`[data-date="${date}"]`);
    if (!section) {
      section = document.createElement('div');
      section.setAttribute('data-date', date);
      section.innerHTML = ` ${date} `;
      const grid = document.createElement('div');
      grid.className = 'photo-grid';
      grid.setAttribute('data-grid', date);
      section.appendChild(grid);
      // Insert before load-more button if exists
      const loadMoreEl = document.getElementById('loadMoreWrap');
      if (loadMoreEl) container.insertBefore(section, loadMoreEl);
      else container.appendChild(section);
    }
    const grid = section.querySelector(`[data-grid="${date}"]`);
    grouped[date].forEach(p => {
      const card = document.createElement('div');
      card.className = `photo-card${p.wide ? ' wide' : ''}`;
      card.innerHTML = `
        
${p.caption}`;
      card.onclick = () => openLightbox(p.globalIdx);
      grid.appendChild(card);
    });
  });
}

function buildGallery(data) {
  filteredPhotos = data;
  displayedCount = 0;
  const container = document.getElementById('galleryContainer');
  container.innerHTML = '';

  if (data.length === 0) {
    container.innerHTML = `
      
          ${photos.length === 0 ? 'Belum ada foto — tambahkan di bagian const photos' : 'Tidak ada foto untuk filter ini'}
        `;
    return;
  }

  // Tambahkan load-more wrapper dulu
  const loadMoreWrap = document.createElement('div');
  loadMoreWrap.id = 'loadMoreWrap';
  loadMoreWrap.style.cssText = 'padding: 36px 0; text-align: center; display: none;';
  loadMoreWrap.innerHTML = `
    
      Tampilkan lebih banyak
    
`;
  container.appendChild(loadMoreWrap);

  const first = Math.min(PHOTOS_PER_PAGE, data.length);
  renderPhotos(data, 0, first);
  displayedCount = first;
  updateLoadMore();
}

function loadMore() {
  const next = Math.min(displayedCount + PHOTOS_PER_PAGE, filteredPhotos.length);
  renderPhotos(filteredPhotos, displayedCount, next);
  displayedCount = next;
  updateLoadMore();
}

function updateLoadMore() {
  const wrap = document.getElementById('loadMoreWrap');
  const info = document.getElementById('loadMoreInfo');
  if (displayedCount < filteredPhotos.length) {
    wrap.style.display = 'block';
    const remaining = filteredPhotos.length - displayedCount;
    info.textContent = `Menampilkan ${displayedCount} dari ${filteredPhotos.length} foto · ${remaining} foto lagi`;
  } else {
    wrap.style.display = displayedCount > PHOTOS_PER_PAGE ? 'block' : 'none';
    if (info) info.textContent = `Semua ${filteredPhotos.length} foto ditampilkan`;
    const btn = document.getElementById('loadMoreBtn');
    if (btn) btn.style.display = 'none';
  }
}

function filterGallery(filter) {
  activeFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  const data = filter === 'semua' ? photos : photos.filter(p => p.date === filter);
  buildGallery(data.map((p, i) => ({ ...p, globalIdx: photos.indexOf(p) })));
}

function openLightbox(idx) {
  currentIndex = idx;
  const p = photos[idx];
  document.getElementById('lightboxImg').src = driveUrl(p.id);
  document.getElementById('lightboxCaption').textContent = `${p.date} — ${p.caption}`;
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}

function navigatePhoto(dir) {
  currentIndex = (currentIndex + dir + photos.length) % photos.length;
  openLightbox(currentIndex);
}

document.addEventListener('keydown', e => {
  if (!document.getElementById('lightbox').classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') navigatePhoto(-1);
  if (e.key === 'ArrowRight') navigatePhoto(1);
});

// Init
function init() {
  // Update count & date
  document.getElementById('photoCount').textContent =
    photos.length > 0 ? `${photos.length} foto` : 'Belum ada foto';

  const dates = photos.map(p => p.date);
  if (dates.length > 0) {
    const sorted = [...new Set(dates)].sort((a, b) => new Date(b) - new Date(a));
    document.getElementById('lastUpdate').textContent = sorted[0];
  } else {
    document.getElementById('lastUpdate').textContent = '—';
  }

  // Build filter tabs
  const uniqueDates = [...new Set(photos.map(p => p.date))].sort((a, b) => new Date(b) - new Date(a));
  const filterBar = document.getElementById('filterBar');
  uniqueDates.forEach(date => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.textContent = date;
    btn.onclick = (e) => filterGallery(date);
    filterBar.appendChild(btn);
  });

  buildGallery(photos.map((p, i) => ({ ...p, globalIdx: i })));
  buildVideos();
}

init();
</script>
